server {
    listen 8080;
    server_name _;
    client_max_body_size 25M;

    root /var/www/multiagent/frontend/dist;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300; }
    location /admin/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location /static/ { alias /var/www/multiagent/backend/staticfiles/; }
    location / { try_files $uri /index.html; }
}
